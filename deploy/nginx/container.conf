# SirpefOffice · Nginx dentro del contenedor `web`
#
# Sirve la SPA y proxyfica /api/ al contenedor `api`. El TLS lo termina Caddy
# (perfil "tls") o un Nginx del host que apunte a 127.0.0.1:8080.

# El canal de eventos en tiempo real (WebSocket) viaja por /api/. Nginx solo
# reenvía el handshake si se le pasan las cabeceras de upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # La API acepta cuerpos de hasta 25 MB (imágenes embebidas).
    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No publicar sourcemaps aunque se generen en el build.
    location ~* \.map$ {
        return 404;
    }

    # API Fastify. Se usa una variable + el DNS interno de Docker para que
    # Nginx no cachee una IP vieja si el contenedor `api` se recrea.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream http://api:3101;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upgrade del canal de eventos en tiempo real.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA con history mode.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash: caché larga.
    location ~* \.(js|css|woff2|svg|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
