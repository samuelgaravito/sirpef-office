# SirpefOffice · Nginx de producción
#
# Supone que el release está activo en /srv/sirpefoffice/current y que
# /var/www/sirpefoffice apunta a /srv/sirpefoffice/current/web.
# Ajusta el dominio y las rutas de los certificados antes de usarlo.

# El canal de eventos en tiempo real (WebSocket) viaja por /api/. Nginx solo
# reenvía el handshake si se le pasan las cabeceras de upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name sirpefoffice.mppef.gob.ve;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sirpefoffice.mppef.gob.ve;

    ssl_certificate     /etc/letsencrypt/live/sirpefoffice.mppef.gob.ve/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sirpefoffice.mppef.gob.ve/privkey.pem;

    # La API acepta cuerpos de hasta 25 MB (imágenes embebidas).
    client_max_body_size 30m;

    root  /var/www/sirpefoffice;
    index index.html;

    # Cabeceras básicas de seguridad.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No publicar sourcemaps aunque se generen en el build.
    location ~* \.map$ {
        return 404;
    }

    # API Fastify.
    location /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upgrade del canal de eventos en tiempo real.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA con history mode.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash: caché larga.
    location ~* \.(js|css|woff2|svg|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
