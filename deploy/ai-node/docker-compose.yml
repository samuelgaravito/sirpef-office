# SirpefOffice · nodo de IA local (equipo con GPU)
#
# Ollama y el agente en la misma red de Docker. No se publica ningún puerto:
# el agente es el único que habla con Ollama y sale hacia el servidor.
#
# Uso:
#   cp .env.example .env      # pon SD_SERVER y SD_TOKEN
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5:14b

name: sirpef-ai

services:
  ollama:
    image: ollama/ollama:0.20.0
    container_name: sirpef-ai-ollama
    restart: unless-stopped
    # Sin "ports": solo es visible desde la red interna de Compose.
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_KEEP_ALIVE: 30m
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  agente:
    image: ${AI_NODE_IMAGE:-sirpef-ai-node:1.0}
    container_name: sirpef-ai-agent
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://ollama:11434

volumes:
  ollama_data:
    name: ollama_data
